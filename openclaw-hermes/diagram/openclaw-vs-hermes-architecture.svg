    <text x="50" y="90" fill="#22d3ee" font-size="11" font-weight="600">OpenClaw</text>
    <text x="50" y="104" fill="#94a3b8" font-size="8">TypeScript · Node.js · 364k Stars</text>

    <!-- Channels Layer -->
    <rect x="50" y="118" width="480" height="90" rx="8" fill="none" stroke="#fbbf24" stroke-width="1"
            stroke-dasharray="4,4"/>
    <text x="66" y="134" fill="#fbbf24" font-size="8" font-weight="500">26+ Messaging Channels</text>

    <rect x="60" y="142" width="108" height="52" rx="6" fill="#0f172a"/>
    <rect x="60" y="142" width="108" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="114" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">WhatsApp</text>
    <text x="114" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">Telegram, Slack…</text>

    <rect x="182" y="142" width="108" height="52" rx="6" fill="#0f172a"/>
    <rect x="182" y="142" width="108" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="236" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">Discord</text>
    <text x="236" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">iMessage, Signal…</text>

    <rect x="304" y="142" width="108" height="52" rx="6" fill="#0f172a"/>
    <rect x="304" y="142" width="108" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="358" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">WeChat</text>
    <text x="358" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">QQ, Feishu…</text>

    <rect x="426" y="142" width="86" height="52" rx="6" fill="#0f172a"/>
    <rect x="426" y="142" width="86" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="469" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">Plugin</text>
    <text x="469" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">Extensible</text>

    <!-- Arrows: Channels → Gateway -->
    <line x1="170" y1="210" x2="170" y2="238" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="290" y1="210" x2="290" y2="238" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="410" y1="210" x2="410" y2="238" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Gateway -->
    <rect x="60" y="244" width="460" height="76" rx="6" fill="#0f172a"/>
    <rect x="60" y="244" width="460" height="76" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="290" y="270" fill="white" font-size="12" font-weight="700" text-anchor="middle">Node.js Gateway（控制平面）
    </text>
    <text x="290" y="288" fill="#94a3b8" font-size="9" text-anchor="middle">Sessions · Presence · Config · Cron ·
        Webhooks · Control UI · Canvas
    </text>
    <text x="290" y="308" fill="#34d399" font-size="8" text-anchor="middle">不执行工具，只管理一切</text>

    <!-- Arrow: Gateway → Pi Agent -->
    <line x1="290" y1="320" x2="290" y2="348" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
    <text x="310" y="338" fill="#94a3b8" font-size="7">RPC</text>

    <!-- Pi Agent -->
    <rect x="130" y="354" width="320" height="60" rx="6" fill="#0f172a"/>
    <rect x="130" y="354" width="320" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="290" y="378" fill="white" font-size="11" font-weight="600" text-anchor="middle">Pi Agent（RPC 子进程）</text>
    <text x="290" y="398" fill="#94a3b8" font-size="9" text-anchor="middle">实际 AI 推理执行</text>

    <!-- Arrow: Gateway → Nodes -->
    <line x1="520" y1="282" x2="520" y2="450" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M 520 282 L 540 282 L 540 450" fill="none" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrow-cyan)"
