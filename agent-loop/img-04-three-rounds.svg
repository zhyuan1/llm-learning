<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="840" height="580">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
            text { font-family: 'JetBrains Mono', 'Noto Sans SC', monospace, sans-serif; }
        </style>
        <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
        <marker id="arr-cyan4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/>
        </marker>
        <marker id="arr-emerald4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
        </marker>
        <marker id="arr-violet4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
        </marker>
        <marker id="arr-amber4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
        </marker>
        <marker id="arr-rose4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#fb7185"/>
        </marker>
        <marker id="arr-green4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="840" height="580" fill="#0f172a"/>
    <rect width="840" height="580" fill="url(#grid4)"/>

    <!-- ============================= -->
    <!-- COLUMN HEADERS (y=30)         -->
    <!-- ============================= -->
    <!-- Col widths: each ~190px, 4 cols, start x=30 -->
    <!-- Col1: 30-215, Col2: 220-415, Col3: 420-615, Col4: 620-810 -->

    <rect x="30" y="30" width="185" height="28" rx="4" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee"
            stroke-width="1"/>
    <text x="122" y="49" text-anchor="middle" font-size="12" font-weight="600" fill="#22d3ee">感知层</text>

    <rect x="220" y="30" width="195" height="28" rx="4" fill="#34d399" fill-opacity="0.15" stroke="#34d399"
            stroke-width="1"/>
    <text x="317" y="49" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">决策层 ReAct</text>

    <rect x="420" y="30" width="195" height="28" rx="4" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"
            stroke-width="1"/>
    <text x="517" y="49" text-anchor="middle" font-size="12" font-weight="600" fill="#a78bfa">行动层</text>

    <rect x="620" y="30" width="190" height="28" rx="4" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24"
            stroke-width="1"/>
    <text x="715" y="49" text-anchor="middle" font-size="12" font-weight="600" fill="#fbbf24">反馈层</text>

    <!-- ============================= -->
    <!-- ROW LABELS                    -->
    <!-- ============================= -->
    <!-- Round 1 at y=73, Round 2 at y=193, Round 3 at y=388 -->

    <!-- Round 1 label -->
    <text x="10" y="105" font-size="10" fill="#64748b" transform="rotate(-90,10,110)">Round 1</text>

    <!-- Round divider lines -->
    <line x1="30" y1="170" x2="810" y2="170" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="30" y1="350" x2="810" y2="350" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ============================= -->
    <!-- ROUND 1 (y=73)                -->
    <!-- ============================= -->

    <!-- 感知: 读取 Issue + register.py -->
    <rect x="33" y="73" width="179" height="52" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="122" y="90" text-anchor="middle" font-size="10" fill="#22d3ee">读取 Issue 描述</text>
    <text x="122" y="104" text-anchor="middle" font-size="10" fill="#22d3ee">+ auth/register.py</text>
    <text x="122" y="118" text-anchor="middle" font-size="9" fill="#64748b">带行号代码片段</text>

    <!-- Arrow 感知→决策 R1 -->
    <line x1="212" y1="99" x2="225" y2="99" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-cyan4)"/>

    <!-- 决策 R1 -->
    <rect x="226" y="73" width="189" height="52" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="320" y="90" text-anchor="middle" font-size="10" fill="#34d399">Thought: 需要找到</text>
    <text x="320" y="104" text-anchor="middle" font-size="10" fill="#34d399">验证逻辑</text>
    <text x="320" y="118" text-anchor="middle" font-size="9" fill="#94a3b8">Action: Search["email_validation"]</text>

    <!-- Arrow 决策→行动 R1 -->
    <line x1="415" y1="99" x2="428" y2="99" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald4)"/>

    <!-- 行动 R1 -->
    <rect x="429" y="73" width="186" height="52" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="522" y="90" text-anchor="middle" font-size="10" fill="#a78bfa">搜索工具执行</text>
    <text x="522" y="104" text-anchor="middle" font-size="9" fill="#94a3b8">返回 validators.py:23</text>
    <text x="522" y="118" text-anchor="middle" font-size="9" fill="#94a3b8">validate_email 函数</text>

    <!-- Arrow 行动→反馈 R1 -->
    <line x1="615" y1="99" x2="628" y2="99" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-violet4)"/>

    <!-- 反馈 R1 -->
    <rect x="629" y="73" width="178" height="52" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="718" y="90" text-anchor="middle" font-size="10" fill="#fbbf24">环境反馈搜索成功</text>
    <text x="718" y="106" text-anchor="middle" font-size="9" fill="#94a3b8">→ 感知更新</text>
    <text x="718" y="119" text-anchor="middle" font-size="9" fill="#94a3b8">知道验证函数位置</text>

    <!-- ============================= -->
    <!-- ROUND 2 (y=183)               -->
    <!-- ============================= -->

    <!-- Round 2 label -->
    <text x="10" y="225" font-size="10" fill="#64748b" transform="rotate(-90,10,230)">Round 2</text>

    <!-- 感知 R2 -->
    <rect x="33" y="183" width="179" height="52" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="122" y="200" text-anchor="middle" font-size="10" fill="#22d3ee">读取 validators.py</text>
    <text x="122" y="214" text-anchor="middle" font-size="10" fill="#22d3ee">第 20–40 行</text>
    <text x="122" y="228" text-anchor="middle" font-size="9" fill="#64748b">带行号代码片段</text>

    <!-- Arrow -->
    <line x1="212" y1="209" x2="225" y2="209" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-cyan4)"/>

    <!-- 决策 R2 -->
    <rect x="226" y="183" width="189" height="52" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="320" y="200" text-anchor="middle" font-size="10" fill="#34d399">Thought: register 未</text>
    <text x="320" y="214" text-anchor="middle" font-size="10" fill="#34d399">调用 validate_email</text>
    <text x="320" y="228" text-anchor="middle" font-size="9" fill="#94a3b8">Action: Edit[register.py line45]</text>

    <!-- Arrow -->
    <line x1="415" y1="209" x2="428" y2="209" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald4)"/>

    <!-- 行动 R2 -->
    <rect x="429" y="183" width="186" height="52" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="522" y="200" text-anchor="middle" font-size="10" fill="#a78bfa">编辑工具执行</text>
    <text x="522" y="214" text-anchor="middle" font-size="9" fill="#94a3b8">修改 register.py line45</text>
    <text x="522" y="228" text-anchor="middle" font-size="9" fill="#94a3b8">插入验证调用</text>

    <!-- Arrow -->
    <line x1="615" y1="209" x2="628" y2="209" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-violet4)"/>

    <!-- 反馈 R2 (rose, 粗边框, 失败) -->
    <rect x="629" y="183" width="178" height="52" rx="5" fill="#1f0a0a" stroke="#fb7185" stroke-width="2.5"/>
    <text x="718" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#fb7185">测试失败</text>
    <text x="718" y="214" text-anchor="middle" font-size="8.5" fill="#94a3b8">NameError: validate_email</text>
    <text x="718" y="227" text-anchor="middle" font-size="8.5" fill="#94a3b8">is not defined</text>
    <text x="718" y="240" text-anchor="middle" font-size="8.5" fill="#fb7185">→ 触发 Reflexion</text>

    <!-- ============================= -->
    <!-- REFLEXION BOX (跨列, emerald) -->
    <!-- ============================= -->
    <!-- Between R2 and R3, y ~ 255-310 -->
    <rect x="220" y="260" width="430" height="60" rx="6" fill="#0a1f14" stroke="#34d399" stroke-width="2"/>
    <text x="435" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Reflexion</text>
    <text x="435" y="297" text-anchor="middle" font-size="10" fill="#94a3b8">"我忘了添加 import 语句"</text>
    <text x="435" y="313" text-anchor="middle" font-size="9" fill="#a78bfa">→ 存入 episodic memory</text>

    <!-- Arrow from 反馈 R2 down to Reflexion -->
    <path d="M 718 235 L 718 250 L 435 250 L 435 262" fill="none" stroke="#fb7185" stroke-width="1.5"
            stroke-dasharray="4,2" marker-end="url(#arr-rose4)"/>

    <!-- Arrow from Reflexion to 感知 R3 -->
    <path d="M 220 290 L 122 290 L 122 362" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,2"
            marker-end="url(#arr-emerald4)"/>

    <!-- ============================= -->
    <!-- ROUND 3 (y=362)               -->
    <!-- ============================= -->

    <!-- Round 3 label -->
    <text x="10" y="408" font-size="10" fill="#64748b" transform="rotate(-90,10,413)">Round 3</text>

    <!-- 感知 R3 (highlighted) -->
    <rect x="33" y="362" width="179" height="58" rx="5" fill="#0a1f14" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="122" y="379" text-anchor="middle" font-size="10" fill="#22d3ee">上下文更新（高亮）</text>
    <text x="122" y="393" text-anchor="middle" font-size="9" fill="#94a3b8">测试错误 + 反思</text>
    <text x="122" y="407" text-anchor="middle" font-size="9" fill="#94a3b8">= 新的感知输入</text>

    <!-- Arrow -->
    <line x1="212" y1="391" x2="225" y2="391" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-cyan4)"/>

    <!-- 决策 R3 -->
    <rect x="226" y="362" width="189" height="58" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="320" y="379" text-anchor="middle" font-size="10" fill="#34d399">Thought: 需要在</text>
    <text x="320" y="393" text-anchor="middle" font-size="10" fill="#34d399">顶部 import</text>
    <text x="320" y="410" text-anchor="middle" font-size="9" fill="#94a3b8">Action: Edit[line3, add import]</text>

    <!-- Arrow -->
    <line x1="415" y1="391" x2="428" y2="391" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald4)"/>

    <!-- 行动 R3 -->
    <rect x="429" y="362" width="186" height="58" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="522" y="379" text-anchor="middle" font-size="10" fill="#a78bfa">编辑执行</text>
    <text x="522" y="393" text-anchor="middle" font-size="9" fill="#94a3b8">添加 import 语句</text>
    <text x="522" y="407" text-anchor="middle" font-size="8" fill="#94a3b8">from auth.validators import...</text>

    <!-- Arrow -->
    <line x1="615" y1="391" x2="628" y2="391" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-violet4)"/>

    <!-- 反馈 R3 (deep green, 成功) -->
    <rect x="629" y="362" width="178" height="58" rx="5" fill="#0a1f0a" stroke="#4ade80" stroke-width="2.5"/>
    <text x="718" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#4ade80">✓ 全部测试通过</text>
    <text x="718" y="400" text-anchor="middle" font-size="10" fill="#94a3b8">任务完成</text>

    <!-- ============================= -->
    <!-- BOTTOM COUPLING TABLE         -->
    <!-- ============================= -->
    <text x="420" y="450" text-anchor="middle" font-size="11" fill="#64748b">四层耦合关系</text>

    <!-- Table grid -->
    <rect x="30" y="458" width="780" height="24" rx="0" fill="#1e293b"/>
    <rect x="30" y="482" width="780" height="24" rx="0" fill="#0f172a"/>

    <!-- Col dividers -->
    <line x1="225" y1="458" x2="225" y2="506" stroke="#334155" stroke-width="1"/>
    <line x1="420" y1="458" x2="420" y2="506" stroke="#334155" stroke-width="1"/>
    <line x1="615" y1="458" x2="615" y2="506" stroke="#334155" stroke-width="1"/>
    <!-- Table outer border -->
    <rect x="30" y="458" width="780" height="48" fill="none" stroke="#334155" stroke-width="1"/>

    <!-- Row 1: column headers -->
    <text x="122" y="474" text-anchor="middle" font-size="10" fill="#22d3ee">感知层</text>
    <text x="317" y="474" text-anchor="middle" font-size="10" fill="#34d399">决策层</text>
    <text x="517" y="474" text-anchor="middle" font-size="10" fill="#a78bfa">行动层</text>
    <text x="715" y="474" text-anchor="middle" font-size="10" fill="#fbbf24">反馈层</text>

    <!-- Row 2: coupling descriptions -->
    <text x="122" y="498" text-anchor="middle" font-size="9" fill="#94a3b8">ACI 接口输入</text>
    <text x="317" y="498" text-anchor="middle" font-size="9" fill="#94a3b8">Thought+Action 生成</text>
    <text x="517" y="498" text-anchor="middle" font-size="9" fill="#94a3b8">工具调用执行</text>
    <text x="715" y="498" text-anchor="middle" font-size="9" fill="#94a3b8">Observation 回写</text>

    <!-- Bottom border -->
    <line x1="30" y1="506" x2="810" y2="506" stroke="#334155" stroke-width="1"/>
</svg>
