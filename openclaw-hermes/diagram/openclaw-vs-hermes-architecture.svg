    <text x="546" y="370" fill="#94a3b8" font-size="7">WebSocket</text>

    <!-- Nodes -->
    <rect x="60" y="430" width="460" height="90" rx="8" fill="none" stroke="#a78bfa" stroke-width="1"
            stroke-dasharray="4,4"/>
    <text x="76" y="446" fill="#a78bfa" font-size="8" font-weight="500">Native Companion Apps</text>

    <rect x="70" y="456" width="140" height="52" rx="6" fill="#0f172a"/>
    <rect x="70" y="456" width="140" height="52" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="140" y="478" fill="white" font-size="10" font-weight="600" text-anchor="middle">macOS</text>
    <text x="140" y="494" fill="#94a3b8" font-size="8" text-anchor="middle">Voice Wake · PTT · Canvas</text>

    <rect x="224" y="456" width="140" height="52" rx="6" fill="#0f172a"/>
    <rect x="224" y="456" width="140" height="52" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="294" y="478" fill="white" font-size="10" font-weight="600" text-anchor="middle">iOS Node</text>
    <text x="294" y="494" fill="#94a3b8" font-size="8" text-anchor="middle">Camera · Bonjour · Canvas</text>

    <rect x="378" y="456" width="130" height="52" rx="6" fill="#0f172a"/>
    <rect x="378" y="456" width="130" height="52" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="443" y="478" fill="white" font-size="10" font-weight="600" text-anchor="middle">Android Node</text>
    <text x="443" y="494" fill="#94a3b8" font-size="8" text-anchor="middle">Camera · Canvas · Voice</text>

    <!-- Security -->
    <rect x="60" y="540" width="220" height="70" rx="6" fill="#0f172a"/>
    <rect x="60" y="540" width="220" height="70" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="170" y="564" fill="white" font-size="10" font-weight="600" text-anchor="middle">安全模型：默认安全</text>
    <text x="170" y="580" fill="#94a3b8" font-size="8" text-anchor="middle">三级沙箱 (off / non-main / all)</text>
    <text x="170" y="596" fill="#94a3b8" font-size="8" text-anchor="middle">SECURITY.md · security audit</text>

    <!-- ClawHub -->
    <rect x="300" y="540" width="220" height="70" rx="6" fill="#0f172a"/>
    <rect x="300" y="540" width="220" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"
            stroke-width="1.5"/>
    <text x="410" y="564" fill="white" font-size="10" font-weight="600" text-anchor="middle">ClawHub 技能注册表</text>
    <text x="410" y="580" fill="#94a3b8" font-size="8" text-anchor="middle">人工编写 · 手动安装 · 社区维护</text>
    <text x="410" y="596" fill="#fbbf24" font-size="8" text-anchor="middle">人来维护 Agent 能力边界</text>

    <!-- Memory -->
    <rect x="60" y="630" width="460" height="56" rx="6" fill="#0f172a"/>
    <rect x="60" y="630" width="460" height="56" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
    <text x="290" y="654" fill="white" font-size="10" font-weight="600" text-anchor="middle">可替换记忆插件槽</text>
    <text x="290" y="672" fill="#94a3b8" font-size="8" text-anchor="middle">MEMORY.md · 灵活但无上限约束 ·
        无冻结快照优化
    </text>

    <!-- ==================== RIGHT: Hermes ==================== -->
    <!-- Region boundary -->
    <rect x="650" y="70" width="520" height="720" rx="12" fill="none" stroke="#34d399" stroke-width="1.5"
