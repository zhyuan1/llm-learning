<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 14px; }
      .axis { fill: #cbd5e1; font-size: 16px; font-weight: 600; }
      .label { fill: #e2e8f0; font-size: 12px; font-weight: 600; }
      .hint { fill: #94a3b8; font-size: 11px; }
      .small { fill: #cbd5e1; font-size: 11px; }
      .card-title { fill: white; font-size: 14px; font-weight: 700; }
      .card-sub { fill: #cbd5e1; font-size: 11px; }
      .quad { fill: none; stroke: #334155; stroke-width: 1; stroke-dasharray: 6 6; }
      .axis-line { stroke: #64748b; stroke-width: 2; marker-end: url(#arrow-slate); }
      .link { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow-slate); }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#0f172a"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <text x="40" y="52" class="title">Agent 主流架构的二维分类</text>
  <text x="40" y="78" class="subtitle">控制权 × 系统重心，比“单 Agent / 多 Agent”更能解释差异</text>

  <rect x="120" y="150" width="960" height="650" rx="18" class="quad"/>
  <line x1="600" y1="760" x2="600" y2="170" class="axis-line"/>
  <line x1="170" y1="470" x2="1030" y2="470" class="axis-line"/>

  <text x="1030" y="500" class="axis">模型主导</text>
  <text x="170" y="500" class="axis">代码主导</text>
  <text x="628" y="172" class="axis">运行时能力</text>
  <text x="628" y="778" class="axis">提示词编排</text>

  <text x="180" y="205" class="hint">更稳、更易审计</text>
  <text x="850" y="205" class="hint">更灵活、更不确定</text>
  <text x="185" y="735" class="hint">路径先于执行</text>
  <text x="820" y="735" class="hint">执行中动态决策</text>

  <rect x="150" y="520" width="220" height="84" rx="10" fill="#0f172a"/>
  <rect x="150" y="520" width="220" height="84" rx="10" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="260" y="553" class="card-title" text-anchor="middle">Workflow / Graph / Flows</text>
  <text x="260" y="578" class="card-sub" text-anchor="middle">workflow · DAG · routing</text>
  <text x="260" y="596" class="card-sub" text-anchor="middle">parallelization · evaluator</text>

  <rect x="410" y="600" width="210" height="78" rx="10" fill="#0f172a"/>
  <rect x="410" y="600" width="210" height="78" rx="10" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.8"/>
  <text x="515" y="632" class="card-title" text-anchor="middle">Manager + tools</text>
  <text x="515" y="657" class="card-sub" text-anchor="middle">入口 Agent 统一收口</text>

  <rect x="640" y="520" width="180" height="74" rx="10" fill="#0f172a"/>
  <rect x="640" y="520" width="180" height="74" rx="10" fill="rgba(120,53,15,0.32)" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="730" y="552" class="card-title" text-anchor="middle">Handoff</text>
  <text x="730" y="575" class="card-sub" text-anchor="middle">角色切换</text>

  <rect x="455" y="395" width="220" height="78" rx="10" fill="#0f172a"/>
  <rect x="455" y="395" width="220" height="78" rx="10" fill="rgba(59,130,246,0.32)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="565" y="427" class="card-title" text-anchor="middle">Orchestrator-worker</text>
  <text x="565" y="452" class="card-sub" text-anchor="middle">并行拆分与综合</text>

  <rect x="790" y="575" width="220" height="82" rx="10" fill="#0f172a"/>
  <rect x="790" y="575" width="220" height="82" rx="10" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="900" y="608" class="card-title" text-anchor="middle">增强型单 Agent</text>
  <text x="900" y="633" class="card-sub" text-anchor="middle">tool loop · retrieval · memory</text>

  <rect x="785" y="355" width="205" height="74" rx="10" fill="#0f172a"/>
  <rect x="785" y="355" width="205" height="74" rx="10" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="887" y="387" class="card-title" text-anchor="middle">Conversation-based</text>
  <text x="887" y="412" class="card-sub" text-anchor="middle">多角色对话协作</text>

  <rect x="720" y="200" width="220" height="86" rx="10" fill="#0f172a"/>
  <rect x="720" y="200" width="220" height="86" rx="10" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.8"/>
  <text x="830" y="232" class="card-title" text-anchor="middle">Event-driven runtime</text>
  <text x="830" y="257" class="card-sub" text-anchor="middle">message bus · state sync</text>
  <text x="830" y="275" class="card-sub" text-anchor="middle">distributed coordination</text>

  <rect x="375" y="175" width="250" height="92" rx="10" fill="#0f172a"/>
  <rect x="375" y="175" width="250" height="92" rx="10" fill="rgba(251,146,60,0.28)" stroke="#fb923c" stroke-width="1.8"/>
  <text x="500" y="208" class="card-title" text-anchor="middle">Managed / runtime-heavy</text>
  <text x="500" y="233" class="card-sub" text-anchor="middle">session · sandbox · checkpoint</text>
  <text x="500" y="251" class="card-sub" text-anchor="middle">trace · approval · deployment</text>

  <line x1="370" y1="560" x2="410" y2="620" class="link"/>
  <line x1="620" y1="620" x2="640" y2="560" class="link"/>
  <line x1="565" y1="473" x2="565" y2="395" class="link"/>
  <line x1="820" y1="575" x2="820" y2="430" class="link"/>
  <line x1="825" y1="355" x2="825" y2="286" class="link"/>
  <line x1="680" y1="240" x2="720" y2="240" class="link"/>

  <rect x="405" y="486" width="390" height="54" rx="26" fill="rgba(15,23,42,0.82)" stroke="#475569" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="600" y="518" class="label" text-anchor="middle">混合式：代码先设边界，模型在边界内做动态决策</text>

  <rect x="780" y="760" width="270" height="84" rx="12" fill="rgba(15,23,42,0.92)" stroke="#334155" stroke-width="1.2"/>
  <text x="915" y="790" class="label" text-anchor="middle">读图提示</text>
  <text x="915" y="815" class="small" text-anchor="middle">越往右，模型自由度越高</text>
  <text x="915" y="834" class="small" text-anchor="middle">越往上，系统越像运行时平台</text>
</svg>
