    <text x="670" y="90" fill="#34d399" font-size="11" font-weight="600">Hermes</text>
    <text x="670" y="104" fill="#94a3b8" font-size="8">Python · SQLite · 118k Stars</text>

    <!-- Terminal Backends -->
    <rect x="670" y="118" width="480" height="90" rx="8" fill="none" stroke="#fbbf24" stroke-width="1"
            stroke-dasharray="4,4"/>
    <text x="686" y="134" fill="#fbbf24" font-size="8" font-weight="500">6 Terminal Backends</text>

    <rect x="680" y="142" width="88" height="52" rx="6" fill="#0f172a"/>
    <rect x="680" y="142" width="88" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="724" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">Local</text>
    <text x="724" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">Direct</text>

    <rect x="782" y="142" width="88" height="52" rx="6" fill="#0f172a"/>
    <rect x="782" y="142" width="88" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="826" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">Docker</text>
    <text x="826" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">Isolated</text>

    <rect x="884" y="142" width="88" height="52" rx="6" fill="#0f172a"/>
    <rect x="884" y="142" width="88" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="928" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">Daytona</text>
    <text x="928" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">Serverless</text>

    <rect x="986" y="142" width="76" height="52" rx="6" fill="#0f172a"/>
    <rect x="986" y="142" width="76" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="1024" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">Modal</text>
    <text x="1024" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">~0 idle</text>

    <rect x="1076" y="142" width="62" height="52" rx="6" fill="#0f172a"/>
    <rect x="1076" y="142" width="62" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="1107" y="164" fill="white" font-size="10" font-weight="600" text-anchor="middle">SSH</text>
    <text x="1107" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">Remote</text>

    <!-- Arrows: Backends → AIAgent -->
    <line x1="724" y1="210" x2="724" y2="238" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="826" y1="210" x2="826" y2="238" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="928" y1="210" x2="928" y2="238" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- AIAgent Core -->
    <rect x="680" y="244" width="460" height="76" rx="6" fill="#0f172a"/>
    <rect x="680" y="244" width="460" height="76" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="910" y="270" fill="white" font-size="12" font-weight="700" text-anchor="middle">AIAgent 核心循环（~3600
        行）
    </text>
    <text x="910" y="288" fill="#94a3b8" font-size="9" text-anchor="middle">同步主循环 · ToolRegistry 派发 · SessionDB
        持久化
    </text>
    <text x="910" y="308" fill="#34d399" font-size="8" text-anchor="middle">瓶颈是 LLM 延迟不是 I/O，同步代码更易推理
    </text>

    <!-- ToolRegistry -->
    <rect x="680" y="340" width="460" height="80" rx="6" fill="#0f172a"/>
    <rect x="680" y="340" width="460" height="80" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="910" y="362" fill="white" font-size="11" font-weight="600" text-anchor="middle">ToolRegistry 单例</text>

    <text x="720" y="384" fill="#22d3ee" font-size="8" font-weight="500">① 自注册</text>
    <text x="800" y="384" fill="#22d3ee" font-size="8" font-weight="500">② 运行时可用性</text>
    <text x="910" y="384" fill="#22d3ee" font-size="8" font-weight="500">③ 动态 Schema 重建</text>
    <text x="720" y="400" fill="#94a3b8" font-size="7">registry.register()</text>
    <text x="800" y="400" fill="#94a3b8" font-size="7">check_fn() 优雅降级</text>
    <text x="910" y="400" fill="#94a3b8" font-size="7">防幻觉：工具不可用时引用也移除</text>

    <!-- coerce_tool_args -->
    <rect x="680" y="434" width="460" height="40" rx="6" fill="#0f172a"/>
    <rect x="680" y="434" width="460" height="40" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
    <text x="910" y="454" fill="white" font-size="9" font-weight="600" text-anchor="middle">coerce_tool_args() —
        参数类型强转（防御 LLM 返回 "42" 而非 42）
    </text>
    <text x="910" y="468" fill="#94a3b8" font-size="7" text-anchor="middle">工具派发前统一类型校验与安全转换</text>

    <!-- Context Compression Pipeline -->
    <rect x="680" y="490" width="460" height="70" rx="6" fill="#0f172a"/>
    <rect x="680" y="490" width="460" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"
            stroke-width="1.5"/>
    <text x="910" y="512" fill="white" font-size="10" font-weight="600" text-anchor="middle">上下文压缩四阶段流水线
    </text>
    <text x="910" y="530" fill="#a78bfa" font-size="8" text-anchor="middle">① 廉价预通过(0 LLM) → ② 边界确定 → ③
        结构化摘要(7部分) → ④ 完整性修复
    </text>
    <text x="910" y="546" fill="#94a3b8" font-size="7" text-anchor="middle">增量更新：后续压缩在前一次摘要基础上叠加
    </text>

    <!-- Security -->
    <rect x="680" y="576" width="220" height="70" rx="6" fill="#0f172a"/>
    <rect x="680" y="576" width="220" height="70" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185"
            stroke-width="1.5"/>
    <text x="790" y="600" fill="white" font-size="10" font-weight="600" text-anchor="middle">安全模型：默认信任</text>
    <text x="790" y="616" fill="#94a3b8" font-size="8" text-anchor="middle">注入扫描 · 路径验证</text>
    <text x="790" y="632" fill="#94a3b8" font-size="8" text-anchor="middle">面向技术用户自我管理</text>

    <!-- RL Flywheel -->
    <rect x="920" y="576" width="220" height="70" rx="6" fill="#0f172a"/>
    <rect x="920" y="576" width="220" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"
            stroke-width="1.5"/>
    <text x="1030" y="600" fill="white" font-size="10" font-weight="600" text-anchor="middle">RL 数据飞轮</text>
    <text x="1030" y="616" fill="#94a3b8" font-size="8" text-anchor="middle">轨迹导出 JSONL → 微调小模型</text>
    <text x="1030" y="632" fill="#fbbf24" font-size="8" text-anchor="middle">Agent 自己维护能力边界</text>

    <!-- Memory -->
    <rect x="680" y="664" width="460" height="56" rx="6" fill="#0f172a"/>
    <rect x="680" y="664" width="460" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"
            stroke-width="1.5"/>
    <text x="910" y="688" fill="white" font-size="10" font-weight="600" text-anchor="middle">有界策展记忆 + 冻结快照
    </text>
    <text x="910" y="706" fill="#94a3b8" font-size="8" text-anchor="middle">MEMORY.md 2200字符 · USER.md 1375字符 ·
        前缀缓存全会话有效
    </text>

    <!-- Skills Auto -->
    <rect x="680" y="736" width="460" height="40" rx="6" fill="#0f172a"/>
    <rect x="680" y="736" width="460" height="40" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="910" y="756" fill="white" font-size="9" font-weight="600" text-anchor="middle">Skills 自动创建 · 自我改进 ·
        654 skills (agentskills.io 开放标准)
    </text>
    <text x="910" y="770" fill="#94a3b8" font-size="7" text-anchor="middle">任务完成 → 经验提取 → 技能生成 →
        使用中改进
    </text>

    <!-- ==================== CENTER: Key Divides ==================== -->
    <!-- Vertical divider -->
    <line x1="600" y1="80" x2="600" y2="780" stroke="#334155" stroke-width="1" stroke-dasharray="6,6"/>

    <!-- VS badge -->
    <rect x="570" y="76" width="60" height="26" rx="13" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="600" y="93" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">VS</text>

    <!-- Divide 1: Runtime -->
    <rect x="555" y="250" width="90" height="52" rx="6" fill="#0f172a"/>
    <rect x="555" y="250" width="90" height="52" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="600" y="270" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">运行时</text>
    <text x="600" y="290" fill="#94a3b8" font-size="7" text-anchor="middle">控制平面 vs 进程</text>

    <!-- Divide 2: Capability -->
    <rect x="555" y="546" width="90" height="52" rx="6" fill="#0f172a"/>
    <rect x="555" y="546" width="90" height="52" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="600" y="566" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">能力边界</text>
    <text x="600" y="586" fill="#94a3b8" font-size="7" text-anchor="middle">人 vs Agent</text>

    <!-- Divide 3: Security -->
    <rect x="555" y="580" width="90" height="52" rx="6" fill="#0f172a"/>
    <rect x="555" y="580" width="90" height="52" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="600" y="600" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">安全姿态</text>
    <text x="600" y="620" fill="#94a3b8" font-size="7" text-anchor="middle">默认安全 vs 信任</text>

    <!-- Bottom summary -->
    <rect x="140" y="775" width="920" height="8" rx="4" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="0.5"/>
</svg>
