<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 660 640" width="660" height="640"
        style="font-family:'JetBrains Mono',monospace">
    <defs>
        <!-- Arrow markers -->
        <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/>
        </marker>
        <marker id="arr-emerald" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
        </marker>
        <marker id="arr-violet" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
        </marker>
        <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
        </marker>

        <!-- Grid pattern -->
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect x="-30" y="-30" width="660" height="640" fill="#0f172a"/>
    <!-- Grid -->
    <rect x="-30" y="-30" width="660" height="640" fill="url(#grid)"/>

    <!-- Title -->
    <text x="300" y="-5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="bold"
            fill="#f1f5f9">LLM Agent 四层闭环架构
    </text>

    <!-- ── LAYER 1: Arrows (behind boxes) ── -->

    <!-- 感知 → 决策 (cyan arc, top-right) -->
    <!-- From right edge of 感知(300,100) to top edge of 决策(470,290) -->
    <path d="M 380,100 Q 490,120 470,220" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr-cyan)"/>

    <!-- 决策 → 行动 (emerald arc, right-bottom) -->
    <!-- From bottom edge of 决策(470,290) to right edge of 行动(300,480) -->
    <path d="M 470,360 Q 490,470 380,480" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald)"/>

    <!-- 行动 → 反馈 (violet arc, bottom-left) -->
    <!-- From left edge of 行动(300,480) to bottom edge of 反馈(130,290) -->
    <path d="M 220,480 Q 110,470 130,360" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr-violet)"/>

    <!-- 反馈 → 感知 (amber arc, left-top) -->
    <!-- From top edge of 反馈(130,290) to left edge of 感知(300,100) -->
    <path d="M 130,220 Q 110,120 220,100" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-amber)"/>

    <!-- ── LAYER 2: Arrow label mask rects (occlude grid/arrows behind text) ── -->
    <!-- 感知→决策 label "观察" at ~(445, 155) -->
    <rect x="426" y="143" width="38" height="16" rx="3" fill="#0f172a"/>
    <!-- 决策→行动 label "执行" at ~(460, 432) -->
    <rect x="441" y="420" width="38" height="16" rx="3" fill="#0f172a"/>
    <!-- 行动→反馈 label "结果" at ~(145, 432) -->
    <rect x="126" y="420" width="38" height="16" rx="3" fill="#0f172a"/>
    <!-- 反馈→感知 label "反思" at ~(140, 155) -->
    <rect x="121" y="143" width="38" height="16" rx="3" fill="#0f172a"/>

    <!-- ── LAYER 3: Arrow labels ── -->
    <text x="445" y="155" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#22d3ee">
        观察
    </text>
    <text x="460" y="432" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#34d399">
        执行
    </text>
    <text x="145" y="432" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#a78bfa">
        结果
    </text>
    <text x="140" y="155" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fbbf24">
        反思
    </text>

    <!-- ── LAYER 4: Center circle LLM Agent ── -->
    <circle cx="300" cy="290" r="55" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="300" y="285" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11"
            font-weight="bold" fill="#e2e8f0">LLM
    </text>
    <text x="300" y="300" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11"
            font-weight="bold" fill="#e2e8f0">Agent
    </text>

    <!-- ── LAYER 5: Node boxes ── -->

    <!-- 感知层 (top, cyan) -->
    <rect x="220" y="65" width="160" height="70" rx="8" fill="#0c2a2e" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- 决策层 (right, emerald) -->
    <rect x="390" y="255" width="160" height="70" rx="8" fill="#0b231e" stroke="#34d399" stroke-width="1.5"/>
    <!-- 行动层 (bottom, violet) -->
    <rect x="220" y="445" width="160" height="70" rx="8" fill="#1a1240" stroke="#a78bfa" stroke-width="1.5"/>
    <!-- 反馈层 (left, amber) -->
    <rect x="50" y="255" width="160" height="70" rx="8" fill="#231c07" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- ── LAYER 6: Node text ── -->

    <!-- 感知层 text -->
    <text x="300" y="87" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="bold"
            fill="#ffffff">感知层
    </text>
    <text x="300" y="101" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#22d3ee">
        Perception
    </text>
    <text x="300" y="117" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#94a3b8">
        模型能看见什么
    </text>

    <!-- 决策层 text -->
    <text x="470" y="277" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12"
            font-weight="bold" fill="#ffffff">决策层
    </text>
    <text x="470" y="291" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#34d399">
        Decision
    </text>
    <text x="470" y="307" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#94a3b8">
        下一步做什么
    </text>

    <!-- 行动层 text -->
    <text x="300" y="467" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12"
            font-weight="bold" fill="#ffffff">行动层
    </text>
    <text x="300" y="481" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#a78bfa">
        Action
    </text>
    <text x="300" y="497" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#94a3b8">
        对环境做什么
    </text>

    <!-- 反馈层 text -->
    <text x="130" y="277" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12"
            font-weight="bold" fill="#ffffff">反馈层
    </text>
    <text x="130" y="291" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fbbf24">
        Feedback
    </text>
    <text x="130" y="307" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#94a3b8">
        做对了没
    </text>
</svg>
