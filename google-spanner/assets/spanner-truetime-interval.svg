<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">TrueTime：时间不是一个点，而是一个区间</title>
  <desc id="desc">展示 earliest、latest 和 uncertainty interval，说明 TT.now 返回的是带误差边界的时间窗口。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#fbbf24"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .label { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .small { fill: #cbd5e1; font-size: 12px; }
      .tiny { fill: #94a3b8; font-size: 11px; }
      .box-title { fill: #f8fafc; font-size: 14px; font-weight: 600; }
      .box-text { fill: #cbd5e1; font-size: 12px; }
      .formula { fill: #67e8f9; font-size: 22px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0f172a"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <text x="64" y="68" class="title">TrueTime：时间不是一个点，而是一个区间</text>
  <text x="64" y="100" class="subtitle">Spanner 不假设“绝对准确的当前时刻”，它暴露的是可计算的时间不确定性。</text>

  <rect x="70" y="132" width="1140" height="520" rx="24" fill="rgba(15,23,42,0.58)" stroke="#334155" stroke-width="1.2"/>

  <text x="640" y="210" text-anchor="middle" class="formula">TT.now() = [ earliest , latest ]</text>
  <text x="640" y="240" text-anchor="middle" class="small">系统拿到的是一个时间窗口，而不是单点时钟</text>

  <line x1="140" y1="390" x2="1120" y2="390" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1132" y="396" class="label">真实时间</text>

  <rect x="420" y="346" width="360" height="88" rx="18" fill="rgba(59,130,246,0.22)" stroke="#60a5fa" stroke-width="2"/>
  <line x1="420" y1="300" x2="420" y2="468" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7,6"/>
  <line x1="780" y1="300" x2="780" y2="468" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7,6"/>
  <line x1="600" y1="318" x2="600" y2="462" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,5"/>

  <text x="420" y="286" text-anchor="middle" class="label">earliest</text>
  <text x="780" y="286" text-anchor="middle" class="label">latest</text>
  <text x="600" y="304" text-anchor="middle" class="small">系统感知的“现在”</text>
  <text x="600" y="384" text-anchor="middle" class="box-title">uncertainty interval</text>
  <text x="600" y="410" text-anchor="middle" class="box-text">真实时间大概率落在这个窗口内</text>

  <line x1="420" y1="250" x2="780" y2="250" stroke="#fbbf24" stroke-width="2.5" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="600" y="236" text-anchor="middle" class="label">误差边界 ε 可计算</text>

  <path d="M 245 330 C 310 330, 320 330, 390 330" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="86" y="246" width="300" height="84" rx="16" fill="#0f172a"/>
  <rect x="86" y="246" width="300" height="84" rx="16" fill="rgba(8,51,68,0.40)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="236" y="276" text-anchor="middle" class="box-title">不是“现在到底几点”</text>
  <text x="236" y="302" text-anchor="middle" class="box-text">而是“我能确定现在落在哪个时间窗口里”</text>

  <path d="M 862 330 C 930 330, 975 330, 1048 330" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="876" y="246" width="322" height="84" rx="16" fill="#0f172a"/>
  <rect x="876" y="246" width="322" height="84" rx="16" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1037" y="276" text-anchor="middle" class="box-title">误差边界可计算</text>
  <text x="1037" y="302" text-anchor="middle" class="box-text">后续事务排序、快照定义才有可证明的基础</text>

  <path d="M 600 442 L 600 508" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="378" y="510" width="444" height="94" rx="18" fill="#0f172a"/>
  <rect x="378" y="510" width="444" height="94" rx="18" fill="rgba(120,53,15,0.28)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="600" y="545" text-anchor="middle" class="box-title">TrueTime 真正提供的能力</text>
  <text x="600" y="572" text-anchor="middle" class="box-text">不是一块“完美时钟”，而是知道自己有多不确定</text>
  <text x="600" y="594" text-anchor="middle" class="tiny">Spanner 后面的 commit wait 和 external consistency 都建立在这层语义之上</text>
</svg>
